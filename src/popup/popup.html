<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #191a1b;
        --muted: #686f75;
        --accent: #5046e5;
        --accent-hover: #4338d4;
        --accent-ink: #ffffff;
        --accent-soft: #f1f0fe;
        --line: #ecebf3;
        --track-off: #c9ccd1;
        --spring: cubic-bezier(0.34, 1.45, 0.55, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c22;
          --ink: #ececf1;
          --muted: #a2a7ad;
          --accent: #8a83ff;
          --accent-hover: #9d97ff;
          --accent-ink: #15151b;
          --accent-soft: rgba(138, 131, 255, 0.13);
          --line: #2c2c35;
          --track-off: #4a4b55;
        }
      }

      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .preload * { transition: none !important; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

      section { padding: 14px 16px; }
      section + section { border-top: 1px solid var(--line); }

      /* Header */
      header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
      header img { width: 28px; height: 28px; transition: filter 300ms ease, opacity 300ms ease; }
      .off header img { filter: grayscale(1); opacity: 0.55; }
      .name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
      .version { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

      /* On/off row: the whole row toggles */
      .power { display: flex; align-items: center; gap: 12px; cursor: pointer; }
      .power-text { flex: 1; min-width: 0; }
      .title { font-weight: 600; }
      .detail { color: var(--muted); font-size: 12.5px; }

      .switch { position: relative; flex: none; width: 38px; height: 22px; }
      .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
      .track {
        position: absolute; inset: 0; border-radius: 999px;
        background: var(--track-off);
        transition: background-color 220ms ease;
      }
      .knob {
        position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 999px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        transition: transform 260ms var(--spring), width 160ms ease;
      }
      .switch input:checked ~ .track { background: var(--accent); }
      .switch input:checked ~ .knob { transform: translateX(16px); }
      /* Squash toward the direction of travel while pressed */
      .power:active .knob { width: 20px; }
      .power:active .switch input:checked ~ .knob { transform: translateX(12px); }
      .switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Class status */
      .status { transition: opacity 300ms ease; }
      .off .status { opacity: 0.45; }

      /* Update card unfolds once when an update is found */
      .update-wrap {
        display: grid; grid-template-rows: 0fr; opacity: 0;
        transition: grid-template-rows 320ms ease, opacity 240ms ease 80ms;
      }
      .update-wrap.shown { grid-template-rows: 1fr; opacity: 1; }
      .update-wrap > div { overflow: hidden; }
      .update { margin: 0 12px 12px; padding: 12px; border-radius: 10px; background: var(--accent-soft); }
      .update .title { color: var(--ink); }
      .update ol { margin: 6px 0 10px; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
      code { font: 12px ui-monospace, Consolas, monospace; color: var(--ink); }

      .reload {
        display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
        padding: 8px 12px; border: 0; border-radius: 8px;
        background: var(--accent); color: var(--accent-ink);
        font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif;
        cursor: pointer;
        transition: background-color 150ms ease, transform 120ms ease;
      }
      .reload:hover { background: var(--accent-hover); }
      .reload:active { transform: scale(0.97); }
      .reload svg { width: 15px; height: 15px; transition: transform 500ms cubic-bezier(0.5, 0, 0.3, 1); }
      .reload:hover svg { transform: rotate(-30deg); }
      .reload.busy svg { transform: rotate(-360deg); }

      footer { display: flex; justify-content: space-between; padding: 10px 16px 12px; border-top: 1px solid var(--line); font-size: 12px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body class="preload">
    <header>
      <img src="../icons/icon-48.png" alt="" />
      <span class="name">easywire</span>
      <span class="version" id="version"></span>
    </header>

    <section>
      <label class="power">
        <span class="power-text">
          <span class="title" id="power-title">easywire is on</span><br />
          <span class="detail" id="power-detail">Activity times, reply counts and pins</span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" id="enabled" />
          <span class="track"></span>
          <span class="knob"></span>
        </span>
      </label>
    </section>

    <section class="status">
      <div class="title" id="status-title">Checking this tab…</div>
      <div class="detail" id="status-detail">&nbsp;</div>
    </section>

    <div class="update-wrap" id="update">
      <div>
        <div class="update">
          <div class="title">Version <span id="update-version"></span> is available</div>
          <ol>
            <li>Run <code>git pull</code> in your easywire folder</li>
            <li>Reload the extension</li>
            <li>Refresh Campuswire</li>
          </ol>
          <button class="reload" id="reload" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66" />
              <path d="M20 4v5h-5" />
            </svg>
            <span id="reload-label">Reload extension</span>
          </button>
        </div>
      </div>
    </div>

    <footer>
      <a href="https://github.com/gRain-is-grainy/easywire" target="_blank" rel="noopener">GitHub</a>
      <a id="notes" target="_blank" rel="noopener">What's new</a>
    </footer>

    <script src="../activity.js"></script>
    <script src="version.js"></script>
    <script src="status.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
