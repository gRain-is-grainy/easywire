# Publishes a GitHub release named after manifest.json's version whenever that version lands on main
# without a matching tag yet. Bumping "version" and merging is the whole release process.
name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version manifest.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
